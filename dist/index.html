<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="HUMAN ERROR — a fast one-screen microgame rush.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-6SiPYNjDFN+PLUa8TqPrL5r7unrns0kuzCjQIeIYtsA='; style-src 'sha256-I5+ewE7yIN1DptGg4HKptyCmHHit4qcCPv+A7Rj1SeM='; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>HUMAN ERROR</title>
<style>:root{color-scheme:dark;--bg:#070b1a;--panel:#0d1530;--card:#141f40;--line:#34466f;--ink:#f7f9ff;--muted:#9eabd0;--cyan:#5de8f7;--violet:#7567ee;--green:#63e6a7;--red:#ff7895;--gold:#f7c65a;--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:radial-gradient(circle at 20% 0%,#30276a44,transparent 34%),linear-gradient(180deg,#070b1a,#090e22)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default;opacity:.5}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
#app{width:min(1040px,100%);height:100dvh;margin:auto;padding:14px 20px;display:grid;grid-template-rows:44px 58px minmax(0,1fr);gap:10px}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:900 14px var(--mono);letter-spacing:.12em}
.utilities{display:flex;gap:7px}
.utilities button{min-width:64px;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:#0b1128;font-size:11px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);align-items:center}
.hud>div{padding:0 18px;border-left:1px solid var(--line)}
.hud>div:first-child{border-left:0;padding-left:0}
.stat-label{display:block;font:9px var(--mono);letter-spacing:.08em;color:var(--muted)}
.hud strong{display:block;margin-top:2px;font:750 clamp(20px,3vw,30px) var(--mono);font-variant-numeric:tabular-nums}
.hud .lives{font-size:17px;color:var(--cyan);letter-spacing:1px}
.arena{min-height:0;overflow:hidden;position:relative;isolation:isolate;display:grid;grid-template-rows:36px minmax(0,1fr) 4px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#0e1734,#0a1127);box-shadow:0 18px 50px #03061155}
.arena:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,#5c49c522,transparent 58%)}
.arena-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid #ffffff0b;font:9px var(--mono);letter-spacing:.045em;color:var(--muted)}
#mode-label{color:var(--cyan);text-align:right}
.stage-content{min-width:0;min-height:0;padding:16px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
h1{max-width:900px;margin:0;white-space:pre-line;overflow-wrap:anywhere;font-size:clamp(30px,5.8vw,62px);font-weight:900;line-height:1;letter-spacing:-.045em}
.hint{max-width:650px;margin:0;color:var(--muted);font:14px/1.4 var(--mono);white-space:pre-line}
.board{width:100%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.actions{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}
.button{min-height:44px;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:#172142;font-size:13px;font-weight:750}
.button:hover:not(:disabled),.choice:hover:not(:disabled){border-color:var(--cyan);background:#20305a}
.button.primary{background:var(--cyan);border-color:var(--cyan);color:#05151c}
.button.large{min-width:180px;min-height:52px;padding:14px 28px;font:850 17px var(--mono)}
.button.bait{min-width:180px;min-height:90px;background:#32192b;border-color:#9c4764;color:#ffe4eb;font:900 clamp(19px,3vw,29px) var(--mono)}
.button.go{background:var(--green);border-color:var(--green);color:#062416}
.options{width:min(780px,100%);display:grid;gap:10px}
.options.count-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.options.count-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.options.count-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.options.count-5,.options.count-6,.options.count-9{grid-template-columns:repeat(3,minmax(0,1fr))}
.options.symbols{width:min(480px,100%);grid-template-columns:repeat(3,minmax(0,1fr))}
#board[data-template="position"] .options.count-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.choice{position:relative;min-height:100px;padding:14px;border:1px solid #50638f;border-radius:12px;background:linear-gradient(145deg,#19264a,#101936);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font:800 clamp(18px,2.8vw,34px) var(--mono);white-space:pre-line;overflow-wrap:anywhere}
.choice kbd{position:absolute;left:7px;top:6px;padding:2px 4px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font:9px var(--mono)}
.symbols .choice{min-height:62px;font-size:33px;padding:8px}
.server-icon{width:34px;height:34px;display:grid;place-items:center;border:1px solid #4ea982;border-radius:7px;color:var(--green);font:900 27px var(--mono)}
.server-icon.fire{border-color:var(--red);color:var(--red)}
[data-kind=choice]:has(.server-icon) .choice-label{font-size:clamp(12px,1.7vw,18px);line-height:1.45}
.mode-picker{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border:1px solid var(--line);border-radius:11px;background:#0a1025}
.mode-button{min-height:44px;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:12px;font-weight:750}
.mode-button.selected{background:var(--violet);color:var(--ink)}
.intro-lobby{width:min(430px,100%);display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--line);border-radius:14px;background:#0b1229}
.identity{display:grid;gap:6px;text-align:left}
.identity-label{font:800 9px var(--mono);letter-spacing:.08em;color:var(--cyan)}
.name-input{width:100%;height:46px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#0a1025;font:700 15px var(--mono)}
.name-input[aria-invalid=true]{border-color:var(--red)}
.seed-label,.notice{margin:0;font:10px var(--mono);color:var(--muted)}
.notice{color:var(--red)}
.memory-code{font:900 clamp(56px,10vw,100px) var(--mono);letter-spacing:.08em;color:var(--cyan)}
.small-code{font-size:clamp(30px,6vw,56px)}
.neutral-label,.bait-caption{font:9px var(--mono);letter-spacing:.08em;color:var(--muted)}
.typed-answer{min-width:180px;min-height:54px;padding:5px 12px;border-bottom:2px solid var(--cyan);font:850 34px var(--mono);letter-spacing:.1em}
.keypad{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.key{width:46px;height:46px;border:1px solid var(--line);border-radius:8px;background:#172142;font:800 19px var(--mono)}
.counter-value{font:900 clamp(50px,9vw,86px) var(--mono);color:var(--cyan);line-height:.9}
.counter-tap{min-width:170px}
.reward{max-width:100%;overflow-wrap:anywhere;color:var(--cyan);font:850 clamp(24px,5vw,50px) var(--mono)}
.mode-description{margin:0;color:var(--muted);font-size:12px}
.result-card{min-width:min(340px,100%);padding:14px 24px;border:1px solid var(--line);border-radius:13px;background:#0b1229;display:flex;flex-direction:column;gap:4px}
.result-status{align-self:center;padding:3px 7px;border:1px solid #3b9a79;border-radius:999px;color:var(--green);font:800 9px var(--mono);letter-spacing:.08em}
.bracket{font:9px var(--mono);letter-spacing:.08em;color:var(--muted)}
.result-ratio{font:900 clamp(42px,7vw,68px) var(--mono);letter-spacing:-.055em}
.result-meta{font:10px var(--mono);color:var(--cyan)}
.competition-result{width:min(440px,100%);padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#0b1229;display:grid;gap:2px}
.competition-result-title{font:800 9px var(--mono);letter-spacing:.03em;color:var(--cyan)}
.competition-result-detail{font-size:10px;color:var(--muted)}
.leaderboard{width:min(640px,100%);padding:10px;display:grid;gap:6px;border:1px solid var(--line);border-radius:13px;background:#0b1229}
.leaderboard-title{font:800 10px var(--mono);letter-spacing:.08em;color:var(--cyan);text-align:left}
.leaderboard-row{min-height:40px;padding:6px 9px;display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;background:#111a36;font:11px var(--mono);text-align:left}
.leaderboard-row.current{outline:2px solid var(--cyan);outline-offset:-2px}
.leaderboard-row.rank-1{border-left:4px solid var(--gold)}
.leaderboard-rank{color:var(--muted)}
.leaderboard-row.rank-1 .leaderboard-rank{color:var(--gold);font-weight:900}
.leaderboard-player{min-width:0;display:flex;align-items:center;gap:6px}
.leaderboard-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leaderboard-score{color:var(--cyan);font-weight:800}
.player-marker{padding:2px 5px;border:1px solid var(--cyan);border-radius:999px;color:var(--cyan);font:900 7px var(--mono)}
.leaderboard-empty{margin:4px 0;color:var(--muted);font-size:11px}
.share-text{width:100%;min-height:100px;padding:12px;border:1px solid var(--line);border-radius:9px;background:#0b1229;resize:vertical;font:11px var(--mono)}
progress{appearance:none;border:0;width:100%;height:4px;background:#202a4d}
progress::-webkit-progress-bar{background:#202a4d}
progress::-webkit-progress-value{background:var(--cyan)}
progress::-moz-progress-bar{background:var(--cyan)}
[data-tone=correct] .arena{border-color:#4ca779}
[data-tone=correct] h1{color:var(--green)}
[data-tone=wrong] .arena{border-color:#bb536d}
[data-tone=wrong] h1{color:var(--red)}
#app[data-phase=intro]{grid-template-rows:44px minmax(0,1fr)}
#app[data-phase=intro] .hud{display:none}
#app[data-phase=intro] .arena-meta{visibility:hidden}
#app[data-phase=intro] .stage-content{gap:16px}
#app[data-phase=intro] h1{font-size:clamp(44px,8vw,78px)}
#app[data-level="2"] .arena:after,#app[data-level="3"] .arena:after,#app[data-level="4"] .arena:after{content:"SYS 73%";position:absolute;right:12px;top:45px;z-index:3;pointer-events:none;padding:4px 7px;border:1px solid #5de8f766;border-radius:999px;background:#071026d9;color:#8ff4ff;font:800 8px var(--mono)}
#app[data-level="3"] .arena:after{content:"SYS 91%";color:#b9adff}
#app[data-level="4"] .arena:after{content:"SYS !!";color:#ffb3c3}
.stage-content{position:relative}
#app[data-level="4"] .stage-content:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 22px,#5de8f708 23px 24px,transparent 25px 46px)}
#board[data-template="focusfilter"] .options{grid-template-columns:repeat(2,minmax(0,1fr))}
#board[data-template="focusfilter"] .choice{min-height:82px;font-size:clamp(13px,2vw,22px);padding:10px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[data-motion=normal][data-phase=feedback] h1{animation:stamp .16s ease-out}
@keyframes stamp{from{transform:scale(.98);opacity:.7}to{transform:scale(1);opacity:1}}
@media(max-width:640px){
  #app{padding:8px 10px;grid-template-rows:44px 52px minmax(0,1fr);gap:7px}
  .brand{font-size:12px}
  .utilities{gap:4px}.utilities button{min-width:56px;min-height:44px;padding:5px 8px;font-size:10px}
  .hud>div{padding:0 9px}.stat-label{font-size:8px}.hud strong{font-size:22px}.hud .lives{font-size:12px}
  .arena{border-radius:12px;grid-template-rows:32px minmax(0,1fr) 4px}
  .arena-meta{padding:0 9px;font-size:8px}
  #mode-label{max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stage-content{padding:12px 10px;gap:10px}
  h1{font-size:34px}.hint{font-size:12px}
  .board{gap:9px}.actions{gap:6px}
  .button{padding:9px 11px;font-size:12px}.button.large{min-width:160px;min-height:48px;padding:11px 22px;font-size:15px}
  .options{gap:6px}.options.count-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .choice{min-height:82px;padding:13px 7px 9px;font-size:21px}.symbols .choice{min-height:52px;font-size:27px}
  .intro-lobby{padding:13px;gap:9px}.name-input{height:44px}
  .mode-button{font-size:11px;padding:7px 5px}
  .result-card{min-width:90%;padding:12px 16px}.result-ratio{font-size:40px}
  .leaderboard{padding:7px;gap:4px}.leaderboard-row{grid-template-columns:70px minmax(0,1fr) auto;min-height:37px;padding:5px 6px;font-size:9px}
  .memory-code{font-size:62px}.reward{font-size:25px}
  #app[data-phase=intro]{grid-template-rows:44px minmax(0,1fr)}
  #app[data-phase=intro] h1{font-size:42px}
}
@media(max-height:700px){
  #app{padding-top:6px;padding-bottom:6px;gap:5px;grid-template-rows:44px 46px minmax(0,1fr)}
  .stage-content{padding-top:8px;padding-bottom:8px;gap:8px}
  .choice{min-height:74px}
  #app[data-phase=intro]{grid-template-rows:44px minmax(0,1fr)}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
