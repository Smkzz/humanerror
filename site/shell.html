<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="HUMAN ERROR — a fast one-screen microgame rush.">
<meta name="referrer" content="no-referrer">
<!-- CSP -->
<title>HUMAN ERROR</title>
<!-- CSS -->
</head>
<body>
<main id="app" data-motion="normal">
  <header class="masthead">
    <div class="brand">HUMAN ERROR</div>
    <div class="utilities"><button id="sound" type="button" aria-pressed="false">Sound off</button><button id="pause" type="button" hidden>Pause</button></div>
  </header>
  <section class="hud" aria-label="Game statistics">
    <div><span class="stat-label">TIME</span><strong id="clock">60.0</strong></div>
    <div><span class="stat-label">SCORE</span><strong id="score">0</strong></div>
    <div><span class="stat-label">LIVES</span><strong id="lives" class="lives">● ● ● ●</strong></div>
  </section>
  <section id="arena" class="arena" aria-labelledby="prompt">
    <div class="arena-meta"><span id="stage">READY</span><span id="mode-label">ADAPTIVE</span></div>
    <div class="stage-content">
      <h1 id="prompt">HUMAN ERROR</h1>
      <p id="hint" class="hint"></p>
      <div id="board" class="board"></div>
      <div id="actions" class="actions"></div>
    </div>
    <progress id="round-progress" value="0" max="1" aria-label="Round time remaining"></progress>
  </section>
  <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
</main>
<noscript>This game needs JavaScript.</noscript>
<!-- JS -->
</body>
</html>
